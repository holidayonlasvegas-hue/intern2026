spring.application.name=vnnic-dns-manager

spring.datasource.url=jdbc:mysql://localhost:3306/vnnic_dns_manager
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
# ===============================
# LOGGING
# ===============================

logging.file.name=logs/vnnic-dns-manager.log
logging.level.root=DEBUG
logging.level.vn.vnnic.dnsmanager=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

